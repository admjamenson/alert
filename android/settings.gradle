// Configura o gerenciamento de plugins
pluginManagement {
    repositories {
        mavenCentral()
        google()
        gradlePluginPortal()
    }
    includeBuild("../node_modules/@react-native/gradle-plugin")
}

// Adiciona os plugins necessários
plugins {
    id("com.facebook.react.settings")
}

// Configurações específicas do React Native
def reactNativeConfigCommand = [
    "node",
    file("../node_modules/@react-native-community/cli/build/bin.js").absolutePath,
    "config",
]

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromCommand(reactNativeConfigCommand)
}

// Nome do projeto raiz
rootProject.name = 'Alert'

// Inclui o módulo principal do aplicativo
include ':app'
includeBuild("../node_modules/@react-native/gradle-plugin")
