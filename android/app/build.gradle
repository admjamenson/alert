apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"
apply plugin: "com.google.firebase.crashlytics"
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")
apply from: project(":react-native-config").projectDir.getPath() + "/dotenv.gradle"

def alertBundleDebugJs =
    (project.findProperty("alertBundleDebugJs") ?: "true").toString().toBoolean()

def alertReleaseSigningPropertiesFile = rootProject.file("keystore.properties")
def alertReleaseSigningProperties = new Properties()
if (alertReleaseSigningPropertiesFile.exists()) {
    alertReleaseSigningPropertiesFile.withInputStream { alertReleaseSigningProperties.load(it) }
}

def alertReleaseSigningValue = { String key ->
    def gradlePropertyName = "alertRelease${key.capitalize()}"
    def envName = "ALERT_RELEASE_${key.replaceAll(/([A-Z])/, '_$1').toUpperCase()}"
    return project.findProperty(gradlePropertyName)
        ?: alertReleaseSigningProperties.getProperty(key)
        ?: System.getenv(envName)
}

def alertResolveReleaseStoreFile = { String path ->
    def moduleRelativeFile = file(path)
    return moduleRelativeFile.exists() ? moduleRelativeFile : rootProject.file(path)
}

def alertReleaseStoreFile = alertReleaseSigningValue("storeFile")
def alertReleaseStorePassword = alertReleaseSigningValue("storePassword")
def alertReleaseKeyAlias = alertReleaseSigningValue("keyAlias")
def alertReleaseKeyPassword = alertReleaseSigningValue("keyPassword")
def alertReleaseSigningReady = [
    alertReleaseStoreFile,
    alertReleaseStorePassword,
    alertReleaseKeyAlias,
    alertReleaseKeyPassword,
].every { it != null && it.toString().trim() }

def alertRequireReleaseSigning =
    (project.findProperty("alertRequireReleaseSigning")
        ?: System.getenv("ALERT_REQUIRE_RELEASE_SIGNING")
        ?: "false").toString().toBoolean()

def alertDebugUseReleaseSigning =
    (project.findProperty("alertDebugUseReleaseSigning")
        ?: System.getenv("ALERT_DEBUG_USE_RELEASE_SIGNING")
        ?: "false").toString().toBoolean()

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // Keep a bundled JS fallback in debug device builds by default so field
    // validation does not depend on a live Metro session. Opt out with
    // -PalertBundleDebugJs=false when you explicitly want Metro-only debug.
    debuggableVariants = alertBundleDebugJs ? [] : ["debug"]

    /* Bundling */
    // Force Metro bundle tasks to run in CI mode so release bundling does not
    // enter file watch mode on Windows shells.
    nodeExecutableAndArgs = ["node", "--require", file("../../scripts/react-native-bundle-ci-env.cjs").absolutePath]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    extraPackagerArgs = ["--max-workers", "1"]

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    // Keep a universal APK for debug to avoid ABI-mismatch crashes on 32-bit devices.
    splits {
        abi {
            enable false
        }
    }

    namespace "com.company.alert"
    defaultConfig {
        applicationId "com.company.alert"
        resValue "string", "build_config_package", "com.company.alert"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        buildConfigField "boolean", "BUNDLED_DEBUG_JS", alertBundleDebugJs.toString()
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (alertReleaseSigningReady) {
                storeFile alertResolveReleaseStoreFile(alertReleaseStoreFile.toString())
                storePassword alertReleaseStorePassword.toString()
                keyAlias alertReleaseKeyAlias.toString()
                keyPassword alertReleaseKeyPassword.toString()
            }
        }
    }
    buildTypes {
        debug {
            signingConfig alertDebugUseReleaseSigning && alertReleaseSigningReady
                ? signingConfigs.release
                : signingConfigs.debug
        }
        release {
            signingConfig alertReleaseSigningReady ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation platform("com.google.firebase:firebase-bom:33.9.0")
    implementation("com.google.firebase:firebase-crashlytics")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// Ensure vector icon fonts are copied before Release lint model is generated.
afterEvaluate {
    tasks.matching { it.name in ["generateReleaseLintVitalReportModel", "lintVitalAnalyzeRelease"] }
        .configureEach {
            dependsOn("copyReactNativeVectorIconFonts")
        }
}

tasks.register("validateAlertReleaseSigning") {
    doLast {
        if (!alertReleaseSigningReady) {
            throw new GradleException(
                "Release signing is not configured. Provide storeFile, storePassword, keyAlias and keyPassword " +
                    "via android/keystore.properties, -PalertRelease*, or ALERT_RELEASE_* environment variables."
            )
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def releaseArtifactRequested = taskGraph.allTasks.any {
        it.path in [":app:assembleRelease", ":app:bundleRelease", ":app:installRelease"]
    }
    if (alertRequireReleaseSigning && releaseArtifactRequested && !alertReleaseSigningReady) {
        throw new GradleException(
            "Store-ready release signing was required, but release signing credentials are not configured."
        )
    }
}
